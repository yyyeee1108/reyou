<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playlist_detail</title>
    <link rel="stylesheet" href="popup.css" />
    <link rel="stylesheet" href="playlist_detail.css" />
  </head>
  <body>
    <header class="top-bar">
      <button id="backBtn" class="back-btn"><</button>
      <div>
        <span class="page-title">재생목록 제목</span>
      </div>
    </header>
    <div class="content">
      <div class="review-container">
        <div class="review-status">
          <span id="detailBadge" class="review-badge">시작 전</span>
          <span id="detailDday" class="dday-text large">dday</span>
        </div>
        <div class="review-count">
          <span class="text">총 복습</span>
          <span id="detailReviewCount" class="count-value">0회</span>
        </div>
      </div>
      <div class="playlist-total-container">
        <div class="playlist-thumbnail-area">
          <img
            src="../assets/mock_image/mock_playlist_thumbnail_3.jpg"
            alt="playlist thumbnail"
            id="playlistThumbnail"
          />
        </div>
        <div class="playlist-info-area">
          <h3 id="playlistTitle">재생목록 제목</h3>
          <div class="playlist-meta">
            <p id="playlistChannelName">게시자: 채널명</p>
            <p id="videoCnt">동영상 0개</p>
          </div>
        </div>
        <button id="playBtn">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="#ffffff"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M8 5V19L19 12L8 5Z" />
          </svg>
        </button>
        <button id="completedBtn">복습 완료</button>
      </div>

      <div id="video-list-container">
        <p class="msg">불러오는 중...</p>
      </div>
    </div>

    <!-- <template> 재사용 가능한 html 틀 -->
    <template id="video-card-template">
      <div class="card">
        <div class="index">1</div>
        <div class="content">
          <div class="thumbnail-area">
            <img
              class="thumbnail-img"
              src="../assets/mock_image/mock_video_thumbnail_1.jpg"
              alt="video thumbnail"
            />
          </div>
        </div>
        <div class="info-area">
          <h3 class="video-title">동영상 제목</h3>
          <div class="meta">
            <span class="channel-name">채널명</span>
          </div>
        </div>
      </div>
    </template>

    <!-- modal 영역 -->
    <div id="completedModal" class="modal hidden">
      <div class="modal-popup">
        <h3 class="modal-title">복습 완료 처리하시겠습니까?</h3>
        <p class="modal-desc">
          오늘 학습 내용을 기록합니다.<br />
          (주기가 아닐 경우 횟수만 증가)
        </p>
        <div class="modal-buttons">
          <button id="modalCancelBtn" class="btn-cancel">취소</button>
          <button id="modalConfirmBtn" class="btn-confirm">확인</button>
        </div>
      </div>
    </div>

    <div id="videoPlayModal", class="modal hidden">
      <div class="modal-popup">
        <h3 class="modal-title">영상을 재생하시겠습니까?</h3>
        <p class="modal-desc">
          새 탭에서 영상이 재생됩니다.<br />
          (확인을 누르면 이동합니다)
        </p>
        <div class="modal-buttons">
          <button id="videoPlayCancelBtn" class="btn-cancel">취소</button>
          <button id="videoPlayConfirmBtn" class="btn-confirm">확인</button>
        </div>
    </div>
    <script src="./playlist_detail.js" type="module"></script>
  </body>
</html>
