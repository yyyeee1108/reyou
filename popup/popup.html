<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="./popup.css" />
    <title>ReYou Home</title>
  </head>
  <body>
    <header class="top-bar">
      <button
        id="openSidePanelBtn"
        class="icon-btn"
        title="사이드 패널에서 열기"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M16 3H19C19.5304 3 20.0391 3.21071 20.4142 3.58579C20.7893 3.96086 21 4.46957 21 5V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M9 3V21"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button
        id="addPlaylistPageBtn"
        class="icon-btn hidden"
        title="현재 재생목록 추가 페이지로 가기"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M14 10H3V12H14V10ZM14 6H3V8H14V6ZM18 14V10H16V14H12V16H16V20H18V16H22V14H18ZM3 16H10V14H3V16Z"
            fill="currentColor"
          />
        </svg>
      </button>
      <span class="page-title">ReYou</span>

      <div class="theme-switch-container">
        <label class="theme-switch" for="darkModeToggle">
          <input type="checkbox" id="darkModeToggle" />
          <div class="slider round"></div>
        </label>
      </div>
    </header>
    <div class="content">
      <div class="filter-container">
        <button class="filter-btn selected" data-filter="due" FilterBtnDue>
          오늘
        </button>
        <button class="filter-btn" data-filter="new" FilterBtnNew>
          시작 전
        </button>
        <button
          class="filter-btn"
          data-filter="in-progress"
          FilterBtnInProgress
        >
          학습 중
        </button>
        <button class="filter-btn" data-filter="completed" FilterBtnCompleted>
          완료
        </button>
        <button class="filter-btn" data-filter="all" FilterBtnAll>전체</button>
      </div>
      <div id="playlist-list-container">
        <p class="msg">불러오는 중...</p>
      </div>
    </div>

    <!-- <template> 재사용 가능한 html 틀 -->
    <template id="playlist-card-template">
      <div class="card">
        <div class="index">1</div>
        <div class="content">
          <div class="thumbnail-area">
            <img
              class="thumbnail-img"
              src="../assets/mock_image/mock_playlist_thumbnail_2.jpg"
              alt="playlist thumbnail"
            />
          </div>
        </div>
        <div class="info-area">
          <h3 class="playlist-title">재생목록 제목</h3>
          <div class="meta">
            <span class="channel-name">채널명</span>
            <span>•</span>
            <span class="video-count">동영상 0개</span>
          </div>
        </div>
        <div class="review-state">
          <span class="review-badge">badge</span>
          <span class="dday-text">dday</span>
        </div>
      </div>
    </template>
    <main class="hidden">
      <div id="loginSection" style="text-align: center; margin-top: 20px">
        <p style="margin-bottom: 10px; color: var(--text-secondary)">
          나만의 복습 리스트를 관리하려면<br />로그인이 필요합니다.
        </p>
        <button class="gsi-material-button" id="googleLoginBtn">
          <div class="gsi-material-button-state"></div>
          <div class="gsi-material-button-content-wrapper">
            <div class="gsi-material-button-icon">
              <svg
                version="1.1"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 48 48"
                xmlns:xlink="http://www.w3.org/1999/xlink"
                style="display: block"
              >
                <path
                  fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
                ></path>
                <path
                  fill="#4285F4"
                  d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
                ></path>
                <path
                  fill="#FBBC05"
                  d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
                ></path>
                <path
                  fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
                ></path>
                <path fill="none" d="M0 0h48v48H0z"></path>
              </svg>
            </div>
            <span class="gsi-material-button-contents"
              >Sign in with Google</span
            >
            <span style="display: none">Sign in with Google</span>
          </div>
        </button>
      </div>

      <div id="userProfileSection" class="hidden" style="padding: 15px">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
          "
        >
          <img
            id="userAvatar"
            src=""
            alt="Profile"
            style="
              width: 40px;
              height: 40px;
              border-radius: 50%;
              background: #eee;
            "
          />
          <div>
            <div id="userName" style="font-weight: bold; font-size: 16px"></div>
            <div style="font-size: 12px; color: var(--text-secondary)">
              ReYou와 함께 복습 중
            </div>
          </div>
        </div>

        <button
          id="logoutBtn"
          style="
            width: 100%;
            padding: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
          "
        >
          로그아웃
        </button>
      </div>

      <div id="playlistContainer"></div>
    </main>
    <script src="./popup.js" type="module"></script>
  </body>
</html>
